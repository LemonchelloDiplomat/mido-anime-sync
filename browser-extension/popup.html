<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mido-anime-sync v0.5</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; color: #20232a; font: 14px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 6px 0 12px; color: #626975; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #c8cdd5; border-radius: 7px; }
    button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 7px; background: #272b33; color: white; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e9edf2; color: #252a32; }
    #status { min-height: 38px; margin-top: 10px; white-space: pre-wrap; }
    .muted { font-size: 12px; }
  </style>
</head>
<body>
  <h1>mido-anime-sync v0.5</h1>
  <p>Проверь найденное аниме и номер серии. Ничего не отправляется без твоего нажатия.</p>
  <button id="scan" class="secondary">Считать страницу</button>
  <label for="title">Название</label>
  <input id="title" autocomplete="off" placeholder="Название аниме">
  <label for="episode">Номер серии</label>
  <input id="episode" type="number" min="1" step="1" placeholder="Например, 7">
  <div id="status" class="muted">Открой страницу просмотра AnimeGO или YummyAnime. Для Anixart можно ввести серию вручную, но сайт не предоставляет браузерный видеоплеер.</div>
  <button id="send">Передать в локальную библиотеку</button>
  <button id="options" class="secondary">Настройки адреса приложения</button>
  <script src="popup.js"></script>
</body>
</html>
