<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки mido-anime-sync Bridge</title>
  <style>
    body { max-width: 620px; margin: 40px auto; padding: 0 18px; color: #20232a; font: 15px/1.5 system-ui, sans-serif; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #c8cdd5; border-radius: 7px; }
    button { margin-top: 12px; padding: 9px 14px; border: 0; border-radius: 7px; background: #272b33; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>mido-anime-sync Bridge</h1>
  <p>Укажи адрес запущенного приложения. По умолчанию используется Vite на локальном компьютере.</p>
  <label for="appUrl">Адрес приложения</label>
  <input id="appUrl" placeholder="http://127.0.0.1:5173">
  <button id="save">Сохранить</button>
  <span id="status" role="status"></span>
  <script src="options.js"></script>
</body>
</html>
