name: Windows Tauri Packaged Build

on:
  push:
    branches:
      - feat/windows-package-local-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare packaged local API runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceRoot = Join-Path $PWD "src-tauri/resources"
          $serverRoot = Join-Path $resourceRoot "server"
          New-Item -ItemType Directory -Force -Path $serverRoot | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.5/win-x64/node.exe" -OutFile (Join-Path $resourceRoot "node.exe")
          Copy-Item (Join-Path $PWD "server/*.mjs") $serverRoot -Force
          if (-not (Test-Path (Join-Path $serverRoot "index.mjs"))) {
            throw "Packaged API entrypoint was not copied."
          }

      - name: Build Windows installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: mido-anime-sync-windows-packaged
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
