name: CI

on:
  push:
    branches:
      - main
      - feature/library-search-filters
      - fix/library-identity-integrity
      - feat/provider-adapter-architecture
      - feat/streaming-site-bridge
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check API server syntax
        run: npm run check:server
      - name: Build
        run: npm run build
