name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/library-search-filters
      - fix/library-identity-integrity
      - feat/provider-adapter-architecture
      - feat/streaming-site-bridge
      - feat/streaming-site-bridge-stacked
      - feature/unified-anime-metadata
      - feat/kodik-watch-tracking
      - feature/full-tracker-sync
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Validate browser extension
        run: npm run check:extension
      - name: Check API server syntax
        run: npm run check:server
      - name: Build
        run: npm run build

  verify-tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Prepare packaged API resources for Tauri config validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceRoot = Join-Path $PWD "src-tauri/resources"
          $serverRoot = Join-Path $resourceRoot "server"
          New-Item -ItemType Directory -Force -Path $serverRoot | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.5/win-x64/node.exe" -OutFile (Join-Path $resourceRoot "node.exe")
          Copy-Item (Join-Path $PWD "server/*.mjs") $serverRoot -Force
      - name: Check Windows Tauri native shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
